name: Rule request
description: Propose a new rule, keyword, or language feature.
labels: [enhancement]
body:
  - type: textarea
    id: rules
    attributes:
      label: What you'd like to write
      description: Show it in Vibe, as if it already worked.
      render: vibe
    validations:
      required: true
  - type: textarea
    id: meaning
    attributes:
      label: What it should do
      description: Step by step, in order.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you'd do it today
      description: Optional. If it's a Gen Z spelling, which existing construct it maps to.
